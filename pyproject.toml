[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[project]
name = "codeatlas"
version = "1.1.0"
description = "RAG assistant for Java/Spring Boot codebases with cited, file-and-line-level answers."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Aakash Siwach" }]
keywords = ["rag", "java", "spring-boot", "code-search", "llm", "tree-sitter"]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "typer>=0.12",
    "pyyaml>=6.0",
    "tree-sitter>=0.23",
    "tree-sitter-java>=0.23",
    "qdrant-client>=1.12",
    "rank-bm25>=0.2.2",
    "networkx>=3.2",
    "numpy>=1.26",
]

[project.optional-dependencies]
local = ["sentence-transformers>=3.0"]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
bedrock = ["boto3>=1.34"]
voyage = ["voyageai>=0.3"]
pdf = ["pypdf>=4.0"]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.5"]
all = ["codeatlas[local,anthropic,openai,bedrock,voyage,pdf]"]

[project.scripts]
codeatlas = "codeatlas.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["codeatlas"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "B", "W"]
ignore = ["E501", "B008", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
