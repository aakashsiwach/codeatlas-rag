version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Versions other dependencies do not accept yet (pip cannot resolve the lock with them):
      - dependency-name: python-dateutil   # botocore needs <3.0
        update-types: ["version-update:semver-major"]
      - dependency-name: uuid-utils        # langsmith needs <1.0
        update-types: ["version-update:semver-major"]
      - dependency-name: mpmath            # sympy 1.14 (torch) needs <1.4
        versions: [">=1.4"]

  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: typescript        # TypeScript 7: deferred, revisit later
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The image stays on Python 3.12, the newest version CI tests and requirements-lock.txt is resolved for.
      - dependency-name: python
        versions: [">=3.13"]

  - package-ecosystem: terraform
    directory: /infra/terraform
    schedule:
      interval: weekly
