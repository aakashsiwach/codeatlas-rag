version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The image stays on Python 3.12, the newest version CI tests and requirements-lock.txt is resolved for.
      - dependency-name: python
        versions: [">=3.13"]

  - package-ecosystem: terraform
    directory: /infra/terraform
    schedule:
      interval: weekly
