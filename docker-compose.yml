services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    # Not published: the api service reaches it on the compose network. To inspect it from the host,
    # bind it to loopback ("127.0.0.1:6333:6333") and set QDRANT__SERVICE__API_KEY together with
    # CODEATLAS_QDRANT_API_KEY.
    volumes:
      - qdrant_data:/qdrant/storage

  api:
    build: .
    depends_on:
      - qdrant
    env_file:
      - path: .env
        required: false
    environment:
      CODEATLAS_QDRANT_URL: http://qdrant:6333
      CODEATLAS_INDEX_DIR: /data/index
      CODEATLAS_REPO_PATH: /repo
      CODEATLAS_DEFAULT_MODE: hybrid+rerank+graph
      # The container listens on 0.0.0.0, but the port below is published on the host's loopback
      # interface only. Set CODEATLAS_API_TOKEN (in .env) before publishing it more widely.
      CODEATLAS_ALLOW_UNAUTHENTICATED: "true"
    volumes:
      # The repository to index. Drop ":ro" if the webhook should `git pull` inside the container.
      - ${REPO_PATH:-./repos/spring-petclinic}:/repo:ro
      - codeatlas_data:/data
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  qdrant_data:
  codeatlas_data:
