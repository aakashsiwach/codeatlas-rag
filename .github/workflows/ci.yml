name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-lock.txt
      - name: Install
        run: pip install -c requirements-lock.txt -e ".[dev]" pytest-github-actions-annotate-failures
      - name: Lint
        run: ruff check --output-format=github .
      - name: Makefile targets parse
        run: make help && make -n check docs
      - name: Test
        if: ${{ !cancelled() }}
        run: pytest -q -p no:cacheprovider -o console_output_style=classic

  ui:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["24", "26"]
    name: ui (node ${{ matrix.node-version }})
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npx vite build

  infra:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.1"
      - name: Format
        run: terraform fmt -check -recursive -diff
      - name: Init (no backend, no AWS credentials)
        run: terraform init -backend=false -input=false
      - name: Validate
        run: terraform validate
      - name: Lint the Dockerfile
        working-directory: .
        run: docker build --check .

  # Runs the README's macOS/Linux quickstart as written (offline fake LLM). Keep in sync with README.md.
  quickstart:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: README quickstart (macOS / Linux)
        env:
          PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
        run: |
          set -euxo pipefail
          python3 -m venv .venv
          source .venv/bin/activate
          pip install -e ".[local,openai,bedrock,dev]"
          git clone https://github.com/spring-projects/spring-petclinic repos/spring-petclinic
          git -C repos/spring-petclinic checkout 500158f
          codeatlas index repos/spring-petclinic
          export CODEATLAS_LLM_PROVIDER=fake
          codeatlas doctor --skip-models
          codeatlas ask "How does searching for owners by last name work?"
          codeatlas ask "What breaks if I change the Owner entity?" --mode hybrid+rerank+graph
          codeatlas ask "Where are pets validated?" --sources-only
          codeatlas impact Owner
